# 状态：已通过 Codex 静态资料审阅；未运行测试，未获产品公开批准
# 规则版本：2026-09-09（shengxiao-rule-ledger.md 补证同步稿）
# 资料访问日期：2026-09-09
# 审核状态：approved（仅独立预期数据）
# 独立资料来源：中国香港天文台逐年公农历对照表文本版（离散年份逐行核验）、中国政府网 2026 放假通知、
#   台湾教育部重编国语辞典、《三命通会》、《五行大义》转录本、国标扫描页及同期官方外交档案。
# 状态模型：expectedPhase ∈ {success, failure}；failureCategory ∈ {invalid_input, unsupported_input, engine_error}；
#   success 用 successQualifier=unique 限定（生肖不用 candidate）。字段语义：expectedPhase 是领域输出阶段，
#   failureCategory 是失败类别，二者分离，不让测试把 invalid_input 当 phase。
# 严禁性约束：预期值全部由独立资料人工核验取得；未执行 lunar-javascript 或任何候选引擎输出后复制为期望。
# sourceRefs/startSource/endSource 只保留可解析键（对应来源台账各来源及定位索引）；中文日期解释放 note 或独立 locator。

