source_access_date: '2026-09-09'
review_status: approved
timezone: Asia/Shanghai（纯日期口径；年界按中国农历正月初一）
year_boundary_rule: 中国农历正月初一 00:00（生肖年界；八字年柱按立春，二者分离）
